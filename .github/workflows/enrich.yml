name: HubSpot contact enrichment

on:
  # Fired by the HubSpot custom code action (see hubspot_custom_code_action.js)
  repository_dispatch:
    types: [hubspot-enrich]
  # Lets you also run it by hand from the Actions tab for testing
  workflow_dispatch:
    inputs:
      company_ids:
        description: "Comma-separated HubSpot company IDs"
        required: true

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 50          # Amplemarket enrichment can poll a while (POLL_MAX_MINUTES)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Run enrichment
        env:
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
          AMPLEMARKET_API_KEY:  ${{ secrets.AMPLEMARKET_API_KEY }}
          LEAD_BATCH_TAG:       ${{ vars.LEAD_BATCH_TAG }}        # optional repo variable
          COMPANY_DONE_PROP:    ${{ vars.COMPANY_DONE_PROP }}     # optional: stamps company true when done
          HS_COMPANY_IDS: ${{ github.event.client_payload.company_ids || github.event.inputs.company_ids }}
        run: python find_full_contacts.py --company-ids "$HS_COMPANY_IDS"

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enrichment-logs
          path: logs/
          if-no-files-found: ignore
